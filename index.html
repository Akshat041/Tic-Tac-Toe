<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <dialog id="introDialog">
      <form id="introForm" method="dialog">
        <h1>Tic Tac Toe</h1>

        <div class="players">
          <!-- player 1 -->
          <div class="player">
            <label for="player1">Player 1</label>
            <input type="text" id="player1" placeholder="(X)" />
          </div>

          <!-- player 2 -->
          <div class="player">
            <label for="player2">Player 2</label>
            <input type="text" id="player2" placeholder="(O)" />
          </div>
        </div>

        <button type="submit" id="startGame">Start Game</button>
      </form>
    </dialog>

    <!-- winner display dialog -->
    <dialog id="winnerDialog">
      <div class="winModal">
        <h1 id="winnerMessage"></h1>
        <form class="buttons" method="dialog">
          <button id="home">Home</button>
          <button id="playAgain">Play Again</button>
        </form>
      </div>
    </dialog>

    <div class="game-container">
      <h1 class="turn"></h1>
      <div class="board"></div>

      <button id="restartGame">Home</button>
    </div>
    <script src="script.js"></script>
  </body>
</html>
