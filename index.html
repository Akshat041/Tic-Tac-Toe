<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <dialog id="introDialog">
      <form id="introForm" method="dialog">
        <h1>Tic Tac Toe</h1>

        <!-- player 1 -->
        <label for="player1">player 1 Name</label>
        <input type="text" id="player1" placeholder="player 1 (X)" />

        <!-- player 2 -->
        <label for="player2">player 1 Name</label>
        <input type="text" id="player2" placeholder="player 2 (O)" />

        <button type="submit" id="startGame">Start Game</button>
      </form>
    </dialog>

    <!-- winner display dialog -->
    <dialog id="winnerDialog">
      <h1 id="winnerMessage"></h1>
      <form method="dialog">
        <button id="home">Home</button>
        <button id="playAgain">Play Again</button>
      </form>
    </dialog>

    <div class="game-container">
      <h1 class="turn"></h1>
      <div class="board"></div>

      <button id="restartGame">Home</button>
    </div>
    <script src="script.js"></script>
  </body>
</html>
